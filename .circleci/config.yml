version: 2.1

jobs:
  check-license:
    docker:
      - image: fsfe/reuse:latest
    steps:
      - checkout
      - run: reuse lint

workflows:
  checks:
    jobs:
      - check-license:
          filters:
            tags:
              only: /.*/
